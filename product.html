<div data-chrome="top"></div>

  <section class="wrap"><div class="pdp" data-pdp></div></section>

      </div>
      <div class="reveal" data-delay="2">
        <p class="muted t-body">Join the list and we'll tell you when new kurtis and skirts land, plus showroom news.</p>
        <form data-news novalidate>
          <input class="field" type="email" name="email" placeholder="Your email address" required aria-label="Email address">
          <button class="btn btn--light" type="submit">Join</button>
        </form>
        <p class="news__note">By joining you agree to our privacy policy. Unsubscribe any time.</p>
      </div>
    </div>
  </section>
