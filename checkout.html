<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — Shasha Trends</title>
<meta name="description" content="Checkout">
<meta name="theme-color" content="#1f4a47">
<meta name="robots" content="noindex">
<meta property="og:title" content="Checkout — Shasha Trends">
<meta property="og:description" content="Checkout">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=1">
<link rel="stylesheet" href="assets/css/shasha.css?v=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%231f4a47'/%3E%3Ccircle cx='12' cy='12' r='5' fill='%23c93f7c'/%3E%3C/svg%3E">
</head>
<body>
<div data-chrome="plain"></div>
<main class="wrap co" data-checkout-page>
  <section class="co__form">
    <h1 class="t-h2" style="margin-bottom:6px">Checkout</h1>
    <p class="muted t-small" style="margin-bottom:24px">Tell us where to send it. We confirm your order and payment on WhatsApp.</p>
    <div id="checkoutLines" class="co__lines"></div>
    <form id="checkoutForm" novalidate>
      <h2 class="t-micro" style="margin:0 0 14px">Contact</h2>
      <div class="fgrid">
        <div><label class="t-micro muted" for="f-name">Full name</label><input class="field" id="f-name" name="name" autocomplete="name"><p class="ferr" data-err="name"></p></div>
        <div><label class="t-micro muted" for="f-phone">Mobile number (WhatsApp)</label><input class="field" id="f-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="012 345 6789"><p class="ferr" data-err="phone"></p></div>
        <div class="fgrid__full"><label class="t-micro muted" for="f-email">Email (optional)</label><input class="field" id="f-email" name="email" type="email" autocomplete="email"></div>
      </div>
      <h2 class="t-micro" style="margin:28px 0 14px">Delivery address</h2>
      <div class="fgrid">
        <div class="fgrid__full"><label class="t-micro muted" for="f-address">Address</label><input class="field" id="f-address" name="address" autocomplete="street-address" placeholder="House no., street, area"><p class="ferr" data-err="address"></p></div>
        <div><label class="t-micro muted" for="f-city">City</label><input class="field" id="f-city" name="city" autocomplete="address-level2"><p class="ferr" data-err="city"></p></div>
        <div><label class="t-micro muted" for="f-state">State</label><input class="field" id="f-state" name="state" autocomplete="address-level1"><p class="ferr" data-err="state"></p></div>
        <div><label class="t-micro muted" for="f-pin">Postcode</label><input class="field" id="f-pin" name="pincode" inputmode="numeric" maxlength="5" autocomplete="postal-code"><p class="ferr" data-err="pincode"></p></div>
        <div class="fgrid__full"><label class="t-micro muted" for="f-note">Order note (optional)</label><input class="field" id="f-note" name="note" placeholder="e.g. gift, call before delivery"></div>
      </div>
      <p class="co__error-banner" id="formError" hidden></p>
      <button class="btn btn--solid btn--full" id="place" type="submit" style="margin-top:24px">Place order</button>
      <p class="t-small muted" id="placeNote" style="margin-top:12px;text-align:center"></p>
    </form>
  </section>

  <aside class="co__summary">
    <h2 class="t-micro" style="margin-bottom:16px">Order summary</h2>
    <div id="summaryLines" class="co__lines"></div>
    <div class="codebox"><input class="field" id="codeInput" placeholder="Discount code" aria-label="Discount code"><button class="btn btn--sm" id="applyCode" type="button">Apply</button></div>
    <p class="t-small" id="codeMsg"></p>
    <div class="co__totals" id="summaryTotals"></div>
  </aside>
</main>
<script src="assets/js/config.js?v=1"></script>
<script src="assets/js/chrome.js?v=1"></script>
<script src="assets/js/data.js?v=1"></script>
<script src="assets/js/shopify.js?v=1"></script>
<script src="assets/js/store.js?v=1"></script>
<script src="assets/js/extras.js?v=1"></script>
<script src="assets/js/checkout.js?v=1"></script>
</body>
</html>
