<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Shasha Trends</title>
<meta name="description" content="Contact Shasha Trends on WhatsApp for sizing, orders and showroom details.">
<meta name="theme-color" content="#1f4a47">
<meta property="og:title" content="Contact — Shasha Trends">
<meta property="og:description" content="Contact Shasha Trends on WhatsApp for sizing, orders and showroom details.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=1">
<link rel="stylesheet" href="assets/css/shasha.css?v=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%231f4a47'/%3E%3Ccircle cx='12' cy='12' r='5' fill='%23c93f7c'/%3E%3C/svg%3E">
</head>
<body>
<div data-chrome="top"></div>
<main>
  <section class="wrap page-head">
    <p class="crumbs"><a href="index.html">Home</a> / Contact</p>
    <h1 class="t-h1">Talk to the team</h1>
    <p class="muted t-body" style="margin-top:10px;max-width:52ch">Sizing, an order, a showroom visit: the fastest way to reach us is WhatsApp.</p>
  </section>
  <section class="wrap" style="padding-bottom:80px;max-width:52ch">
    <a class="btn btn--wa btn--full" data-wa-link="Hi Shasha Trends! I have a question.">Chat on WhatsApp</a>
    <p class="t-small muted" style="margin-top:12px">Or leave a note below and we'll reply on WhatsApp. Instagram: <a class="link-u" href="https://www.instagram.com/shasha.trends/" target="_blank" rel="noopener">@shasha.trends</a></p>
    <form data-contact novalidate style="margin-top:36px;display:flex;flex-direction:column;gap:20px">
      <div><label class="t-micro muted" for="contactName">Name</label><input class="field" id="contactName" name="name" autocomplete="name" required style="margin-top:8px"></div>
      <div><label class="t-micro muted" for="contactPhone">Phone number</label><input class="field" id="contactPhone" name="phone" type="tel" autocomplete="tel" required style="margin-top:8px"></div>
      <div><label class="t-micro muted" for="contactMessage">Message</label><textarea class="field" id="contactMessage" name="message" rows="4" style="margin-top:8px"></textarea></div>
      <button class="btn btn--solid" type="submit">Send via WhatsApp</button>
      <p class="t-small muted" data-contact-note style="display:none"></p>
    </form>
  </section>
</main>
<div data-chrome="bottom"></div>
<script src="assets/js/config.js?v=1"></script>
<script src="assets/js/chrome.js?v=1"></script>
<script src="assets/js/data.js?v=1"></script>

<script src="assets/js/app.js?v=1"></script>
</body>
</html>
